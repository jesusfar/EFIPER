name = "efiper"
compatibility_date = "2026-06-19"
main = "worker/index.ts"

[assets]
directory = "./dist/"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "efiper"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
